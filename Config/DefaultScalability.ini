[ScalabilitySettings]
; Custom Scalability overrides for Backrooms 5.8
; Fallback profiles ensuring playable performance on GPUs without Hardware Ray Tracing support

[GlobalIlluminationQuality@0]
; Low: Disable Lumen Diffuse Indirect, fallback to ambient/skylight approximation
r.DistanceFieldAO=0
r.AOQuality=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.HardwareRayTracing=0
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@1]
; Medium: Software Lumen with reduced surface cache
r.DistanceFieldAO=1
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=0
r.Lumen.HardwareRayTracing=0
r.LumenScene.SurfaceCache.AtlasSize=2048
r.LumenScene.SurfaceCache.CardTexelDensityScale=50
r.LumenScene.SurfaceCache.CardMinResolution=2
r.LumenScene.SurfaceCache.CardMaxResolution=256
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@2]
; High: Full Software Lumen with screen probe gather (standard representation)
r.DistanceFieldAO=1
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=1
r.Lumen.HardwareRayTracing=0
r.LumenScene.SurfaceCache.AtlasSize=3584
r.LumenScene.SurfaceCache.CardTexelDensityScale=100
r.LumenScene.SurfaceCache.CardMinResolution=4
r.LumenScene.SurfaceCache.CardMaxResolution=512
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@3]
; Epic: High-fidelity Software Lumen with high-res surface cache
r.DistanceFieldAO=1
r.AOQuality=2
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=1
r.Lumen.HardwareRayTracing=0
r.LumenScene.SurfaceCache.AtlasSize=4096
r.LumenScene.SurfaceCache.CardTexelDensityScale=100
r.LumenScene.SurfaceCache.CardMinResolution=2
r.LumenScene.SurfaceCache.CardMaxResolution=512
r.RayTracing.Scene.BuildMode=0

[ReflectionQuality@0]
; Low: Fallback to simple reflection captures / screen reflections
r.Lumen.Reflections.Allow=0
r.Lumen.Reflections.HardwareRayTracing=0
r.SSR.Quality=0

[ReflectionQuality@1]
; Medium: Lumen Software Reflections
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.4

[ReflectionQuality@2]
; High: Standard Lumen Software Reflections
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.6

[ReflectionQuality@3]
; Epic: High Quality Lumen Software Reflections
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.8

[ShadowQuality@0]
; Low: Low-resolution virtual shadow maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=8

[ShadowQuality@1]
; Medium: Mid-resolution virtual shadow maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=0.5
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=16

[ShadowQuality@2]
; High: Full resolution virtual shadow maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32

[ShadowQuality@3]
; Epic: Full resolution virtual shadow maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32
