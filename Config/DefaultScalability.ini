[ScalabilitySettings]
; Custom Scalability overrides for Backrooms 5.8
; All CVars here are ECVF_Scalability-compliant for clean cooking & packaged builds.

; ============================================================================
; GLOBAL ILLUMINATION (Lumen disabled on Low/Medium, Software Lumen on High/Epic)
; ============================================================================

[GlobalIlluminationQuality@0]
; Low: Baked/static ambient lighting, Lumen GI off, DFAO off
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.TraceMeshSDFs=0
r.DistanceFieldAO=0
r.AOQuality=0
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@1]
; Medium: Static/direct lighting, Lumen GI off, DFAO off
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.TraceMeshSDFs=0
r.DistanceFieldAO=0
r.AOQuality=0
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@2]
; High: Full Software Lumen with screen probe gather
r.DistanceFieldAO=1
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=1
r.LumenScene.SurfaceCache.AtlasSize=3584
r.LumenScene.SurfaceCache.CardTexelDensityScale=100
r.LumenScene.SurfaceCache.CardMinResolution=4
r.LumenScene.SurfaceCache.CardMaxResolution=512
r.RayTracing.Scene.BuildMode=0

[GlobalIlluminationQuality@3]
; Epic: High-fidelity Software Lumen with high-res surface cache
r.DistanceFieldAO=1
r.AOQuality=2
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.FinalGatherMethod=1
r.LumenScene.SurfaceCache.AtlasSize=4096
r.LumenScene.SurfaceCache.CardTexelDensityScale=100
r.LumenScene.SurfaceCache.CardMinResolution=2
r.LumenScene.SurfaceCache.CardMaxResolution=512
r.RayTracing.Scene.BuildMode=0

; ============================================================================
; REFLECTIONS (Disabled on Low/Medium, Software Lumen on High/Epic)
; ============================================================================

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1

; ============================================================================
; SHADOWS (Standard shadow maps on Low/Medium, VSM on High/Epic)
; ============================================================================

[ShadowQuality@0]
; Low: Standard shadow maps (512px max), aggressive light draw distance culling
r.Shadow.Virtual.Enable=0
r.ShadowQuality=1
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=512
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.5
r.LightMaxDrawDistanceScale=0.5
r.DistanceFieldShadowing=0
r.VolumetricFog=0

[ShadowQuality@1]
; Medium: Standard shadow maps (1024px max), moderate distance culling
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.75
r.LightMaxDrawDistanceScale=0.75
r.DistanceFieldShadowing=0

[ShadowQuality@2]
; High: Virtual shadow maps enabled
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.LightMaxDrawDistanceScale=1.0

[ShadowQuality@3]
; Epic: Full resolution virtual shadow maps
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.LightMaxDrawDistanceScale=1.0

; ============================================================================
; TEXTURES (Hard pool caps: 512 MB Low, 768 MB Medium, MipBias=1 on Low)
; ============================================================================

[TextureQuality@0]
; Low: 512 MB pool cap, MipBias=1 caps 2048px carpet/wall textures at 1024px
r.Streaming.PoolSize=512
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=1
r.Streaming.UsePerTextureBias=0
r.MaxAnisotropy=2

[TextureQuality@1]
; Medium: 768 MB pool cap, full 2K mips allowed with streaming
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=4

[TextureQuality@2]
; High: 1000 MB pool cap
r.Streaming.PoolSize=1000
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=8

[TextureQuality@3]
; Epic: 1500 MB pool cap
r.Streaming.PoolSize=1500
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=16

; ============================================================================
; ANTI-ALIASING & RENDER RESOLUTION (TSR upscaling)
; ============================================================================

[AntiAliasingQuality@0]
; Low: 67% internal resolution upscaled via TSR (720p/900p output)
r.ScreenPercentage=67
r.TSR.History.ScreenPercentage=67
r.TSR.History.R11G11B10=1

[AntiAliasingQuality@1]
; Medium: 85% internal resolution upscaled via TSR (1080p output)
r.ScreenPercentage=85
r.TSR.History.ScreenPercentage=100
r.TSR.History.R11G11B10=1

[AntiAliasingQuality@2]
; High: Native 100% with 100% TSR history
r.ScreenPercentage=100
r.TSR.History.ScreenPercentage=100

[AntiAliasingQuality@3]
; Epic: Native 100% with 100% TSR history
r.ScreenPercentage=100
r.TSR.History.ScreenPercentage=100

; ============================================================================
; POST PROCESSING (Strip heavy passes on Low, keep cheap vignette)
; ============================================================================

[PostProcessQuality@0]
; Low: Strip Bloom, Chromatic Aberration, Motion Blur, DoF, AO
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.AmbientOcclusionLevels=0
r.RenderTargetPoolMin=150

[PostProcessQuality@1]
; Medium: Lightweight Bloom, no Chromatic Aberration or Motion Blur
r.BloomQuality=2
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.RenderTargetPoolMin=250

[PostProcessQuality@2]
r.BloomQuality=4
r.SceneColorFringeQuality=1
r.MotionBlurQuality=2
r.RenderTargetPoolMin=350

[PostProcessQuality@3]
r.BloomQuality=5
r.SceneColorFringeQuality=1
r.MotionBlurQuality=4
r.RenderTargetPoolMin=400
